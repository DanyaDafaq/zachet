<style>
:root{--bg:#f6f5f1;--fg:#1c1c1a;--card:#fff;--bd:#d8d6cf;--ac:#2f6f4f;--ok:#d9f0e2;--bad:#f8dcdc}

button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 20px;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}
input[type=text],input[type=number]{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
.row{margin:10px 0}.muted{opacity:.7;font-size:15px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:40px;font-weight:700}
